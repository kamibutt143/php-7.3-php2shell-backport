name: verify-backport

# Reproducibility check for the PHP 7.3.33 php2shell backport:
# pristine tarball -> hash check -> patch -> build -> runtime assertions
# -> Zend/session test suites with an exact known-failure set.

on:
  push:
  pull_request:

jobs:
  fpm-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download pristine PHP 7.3.33 and verify its hash
        run: |
          curl -fsSLO https://www.php.net/distributions/php-7.3.33.tar.xz
          echo "166eaccde933381da9516a2b70ad0f447d7cec4b603d07b9a916032b215b90cc  php-7.3.33.tar.xz" | sha256sum -c -

      - name: Verify the patch artifact hash
        run: |
          echo "632f61e8ca409635f57d3a6aec3e0ab710921a292eec630e2190326539c8546a  php-7.3.33-php2shell-backport.patch" | sha256sum -c -

      - name: Extract and apply
        run: |
          tar xf php-7.3.33.tar.xz
          cd php-7.3.33
          patch -p1 < ../php-7.3.33-php2shell-backport.patch

      - name: Configure (with FPM) and build
        working-directory: php-7.3.33
        run: |
          ./configure --disable-all --disable-libxml --enable-cli \
            --enable-session --enable-json --enable-ctype --enable-tokenizer \
            --enable-fpm
          make -j"$(nproc)"

      - name: FPM smoke test (healthy requests, OOM worker recovery)
        working-directory: php-7.3.33
        run: python3 ../ci/fcgi_smoke.py "$PWD/sapi/fpm/php-fpm"

  apache-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download pristine PHP 7.3.33 and verify its hash
        run: |
          curl -fsSLO https://www.php.net/distributions/php-7.3.33.tar.xz
          echo "166eaccde933381da9516a2b70ad0f447d7cec4b603d07b9a916032b215b90cc  php-7.3.33.tar.xz" | sha256sum -c -

      - name: Verify the patch artifact hash
        run: |
          echo "632f61e8ca409635f57d3a6aec3e0ab710921a292eec630e2190326539c8546a  php-7.3.33-php2shell-backport.patch" | sha256sum -c -

      - name: Extract and apply
        run: |
          tar xf php-7.3.33.tar.xz
          cd php-7.3.33
          patch -p1 < ../php-7.3.33-php2shell-backport.patch
          test -z "$(find . -name '*.rej' -print -quit)"

      # Apache + headers for --with-apxs2. apache2-dev provides apxs2 and
      # the APR development files. The system Apache configuration in
      # /etc/apache2 is never used: the smoke script starts httpd with a
      # fully temporary config and loads only the module built here.
      - name: Install Apache and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-dev

      # Non-thread-safe build (the default) -> the smoke config loads the
      # prefork MPM; mod_php must never run under a threaded MPM with NTS.
      - name: Configure (with mod_php via apxs2) and build
        working-directory: php-7.3.33
        run: |
          ./configure --disable-all --disable-libxml --enable-cli \
            --enable-session --enable-json --enable-ctype --enable-tokenizer \
            --with-apxs2=/usr/bin/apxs2
          make -j"$(nproc)"
          test -f libs/libphp7.so

      - name: Apache mod_php smoke test (HTTP identity, multipart limit, stability)
        working-directory: php-7.3.33
        env:
          APACHE_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/apache-smoke-logs
        run: python3 ../ci/apache_smoke.py /usr/sbin/apache2 "$PWD/libs/libphp7.so"

      - name: Upload Apache logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apache-smoke-logs
          path: apache-smoke-logs/
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download pristine PHP 7.3.33 and verify its hash
        run: |
          curl -fsSLO https://www.php.net/distributions/php-7.3.33.tar.xz
          echo "166eaccde933381da9516a2b70ad0f447d7cec4b603d07b9a916032b215b90cc  php-7.3.33.tar.xz" | sha256sum -c -

      - name: Verify the patch artifact hash
        run: |
          echo "632f61e8ca409635f57d3a6aec3e0ab710921a292eec630e2190326539c8546a  php-7.3.33-php2shell-backport.patch" | sha256sum -c -

      - name: Extract, dry-apply, apply
        run: |
          tar xf php-7.3.33.tar.xz
          cd php-7.3.33
          patch -p1 --dry-run < ../php-7.3.33-php2shell-backport.patch
          patch -p1 < ../php-7.3.33-php2shell-backport.patch
          test -z "$(find . -name '*.rej' -print -quit)"

      - name: Configure and build
        working-directory: php-7.3.33
        run: |
          ./configure --disable-all --disable-libxml --enable-cli \
            --enable-session --enable-json --enable-ctype --enable-tokenizer
          make -j"$(nproc)"

      - name: Runtime assertions
        working-directory: php-7.3.33
        run: |
          sapi/cli/php -v | grep -q "PHP 7.3.33"
          # The fix registers max_multipart_body_parts; stock 7.3.33 returns bool(false) here.
          sapi/cli/php -r 'exit(ini_get("max_multipart_body_parts") === "-1" ? 0 : 1);'
          # Concat smoke test (exercises the patched VM guards' code paths).
          sapi/cli/php -r '$a = "foo"; $a .= "bar"; $b = $a . "baz"; exit($b === "foobarbaz" ? 0 : 1);'
          # Session extension present.
          sapi/cli/php -m | grep -qi '^session$'

      - name: Test suites — failures must match the known set exactly
        working-directory: php-7.3.33
        run: |
          # NOTE: do not use run-tests.php -w here — in PHP 7.3 it also
          # lists the XFAIL (expected-fail) tests, not just real failures.
          # Parse the FAILED TEST SUMMARY section of the output instead.
          sapi/cli/php run-tests.php -q -P \
            Zend/tests ext/session/tests > /tmp/test-output.txt || true
          # Guard 1: the run must have completed with a full summary —
          # a crashed runner produces partial output, not a summary.
          grep -q '^FAILED TEST SUMMARY' /tmp/test-output.txt || {
            echo "::error::No FAILED TEST SUMMARY in run-tests output — test runner crashed or aborted"; exit 1; }
          grep -q '^Tests passed' /tmp/test-output.txt || {
            echo "::error::No test totals in run-tests output — test runner crashed or aborted"; exit 1; }
          # Guard 2: a sane number of tests must actually have passed
          # (baseline for this tree/config: 2727 passed).
          passed=$(grep -oE '^Tests passed +: +[0-9]+' /tmp/test-output.txt | grep -oE '[0-9]+$')
          echo "Tests passed: $passed"
          [ "$passed" -ge 2700 ] || {
            echo "::error::Only $passed tests passed (< 2700) — too few tests executed"; exit 1; }
          # Exact known-failure comparison.
          sed -n '/^FAILED TEST SUMMARY/,/^=====/p' /tmp/test-output.txt \
            | grep -oE '\[(Zend/tests|ext/session/tests)/[^]]+\.phpt\]' \
            | tr -d '[]' | sort -u > /tmp/failed-sorted.txt
          sort -u ../ci/expected-failures.txt > /tmp/expected-sorted.txt
          diff /tmp/expected-sorted.txt /tmp/failed-sorted.txt
